name: Launcher CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Check main process syntax
        run: node --check src/main.js
      - name: Check preload syntax
        run: node --check src/preload.js
      - name: Check renderer syntax
        run: node --check src/renderer.js
      - name: Check builder configuration syntax
        run: node --check electron-builder.config.cjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            pattern: dist/*.exe
          - os: ubuntu-latest
            artifact: linux
            pattern: dist/*.AppImage
          - os: macos-latest
            artifact: macos
            pattern: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install AppImage runtime dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: thornyx-launcher-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
